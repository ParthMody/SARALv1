<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SARAL v2 — Operator Login</title>
  <style>
    :root{
      --bg: #f3f5f8;
      --panel: #ffffff;
      --ink: #102a56;
      --ink-2: #244271;
      --muted: #6f7f98;
      --line: #d9e1ec;
      --line-soft: #e9eef5;
      --focus: rgba(16, 42, 86, 0.12);
      --danger-bg: #fff1f1;
      --danger-line: #f2a3a3;
      --danger-text: #a12b2b;
      --btn: #163764;
      --btn-hover: #1e467d;
      --shadow: 0 18px 45px rgba(16, 42, 86, 0.08);
      --radius-xl: 20px;
      --radius-lg: 14px;
      --radius-md: 10px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(22,55,100,0.05), transparent 28%),
        radial-gradient(circle at bottom right, rgba(22,55,100,0.04), transparent 22%),
        var(--bg);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .shell {
      width: 100%;
      max-width: 560px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      padding: 34px 34px 28px;
    }

    .brand {
      text-align: center;
      margin-bottom: 26px;
    }

    .logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      margin-bottom: 14px;
    }

    .logo-img {
      max-width: 210px;
      max-height: 64px;
      width: auto;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .brand h1 {
      margin: 0;
      font-size: 2rem;
      line-height: 1.1;
      letter-spacing: -0.02em;
      font-weight: 800;
      color: var(--ink);
    }

    .brand p {
      margin: 10px 0 0;
      font-size: 0.98rem;
      line-height: 1.45;
      color: var(--muted);
    }

    .error-banner {
      background: var(--danger-bg);
      border: 1px solid var(--danger-line);
      color: var(--danger-text);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      font-size: 0.93rem;
      margin-bottom: 18px;
    }

    form {
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--ink);
    }

    .required {
      color: #d64545;
      margin-left: 2px;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      height: 52px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #fbfcfe;
      color: #142033;
      font-size: 1rem;
      padding: 0 15px;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      appearance: none;
    }

    select {
      background-image:
        linear-gradient(45deg, transparent 50%, #5d6d88 50%),
        linear-gradient(135deg, #5d6d88 50%, transparent 50%);
      background-position:
        calc(100% - 20px) calc(50% - 3px),
        calc(100% - 14px) calc(50% - 3px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 40px;
    }

    input::placeholder {
      color: #8d9ab0;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--ink-2);
      box-shadow: 0 0 0 4px var(--focus);
      background: #ffffff;
    }

    .hint {
      margin: 7px 0 0;
      font-size: 0.82rem;
      line-height: 1.45;
      color: #8795aa;
    }

    .divider {
      border: 0;
      border-top: 1px solid var(--line-soft);
      margin: 22px 0 18px;
    }

    .btn-submit {
      width: 100%;
      height: 54px;
      border: 0;
      border-radius: 12px;
      background: var(--btn);
      color: #ffffff;
      font-size: 1.02rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: transform 0.06s ease, background 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 10px 24px rgba(22,55,100,0.18);
    }

    .btn-submit:hover {
      background: var(--btn-hover);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .footer-note {
      margin: 18px 4px 0;
      text-align: center;
      font-size: 0.84rem;
      line-height: 1.5;
      color: #91a0b4;
    }

    @media (max-width: 640px) {
      .card {
        padding: 26px 20px 22px;
        border-radius: 18px;
      }

      .brand h1 {
        font-size: 1.7rem;
      }

      .row-2 {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .logo-img {
        max-width: 180px;
        max-height: 56px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="brand">
        <div class="logo-wrap">
          <img src="/static/assets/saral.png" class="logo-img" alt="SARAL" onerror="this.style.display='none'">
        </div>
        <h1>SARAL v2</h1>
        <p>Welfare Triage Decision Research — Operator Session</p>
      </div>

      {% if error %}
      <div class="error-banner" role="alert">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/login" novalidate>
        <div class="form-group">
          <label for="initials">Initials <span class="required">*</span></label>
          <input
            type="text"
            id="initials"
            name="initials"
            maxlength="8"
            placeholder="e.g. A.K."
            autocomplete="off"
            required
          />
          <p class="hint">Non-identifying. Used only to label your session.</p>
        </div>

        <div class="row-2">
          <div class="form-group">
            <label for="age">Age <span class="required">*</span></label>
            <input
              type="number"
              id="age"
              name="age"
              min="18"
              max="80"
              placeholder="e.g. 34"
              required
            />
          </div>

          <div class="form-group">
            <label for="experience_years">Years of Experience <span class="required">*</span></label>
            <input
              type="number"
              id="experience_years"
              name="experience_years"
              min="0"
              max="60"
              placeholder="e.g. 7"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="role">Role <span class="required">*</span></label>
          <select id="role" name="role" required>
            <option value="" disabled selected>Select your role...</option>
            <option value="welfare_officer">Welfare Officer</option>
            <option value="administrative_officer">Administrative Officer</option>
            <option value="field_supervisor">Field Supervisor</option>
            <option value="retired_official">Retired Official</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="locale">Preferred Language <span class="required">*</span></label>
          <select id="locale" name="locale" required>
            <option value="en">English</option>
            <option value="mr">मराठी (Marathi)</option>
          </select>
        </div>

        <hr class="divider" />

        <button type="submit" class="btn-submit">Begin Session →</button>
      </form>

      <p class="footer-note">
        Your session is confidential. Do not share your screen with other operators.
      </p>
    </div>
  </div>
</body>
</html>
