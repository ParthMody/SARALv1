<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SARAL v2 — Practice</title>
  <style>
    :root{
      --bg:#f3f5f8;--panel:#fff;--ink:#102a56;--ink-2:#21406d;
      --text:#213247;--muted:#6e7f97;--line:#dbe3ee;--line-soft:#e9eef5;
      --green-text:#166534;--red-text:#991b1b;--teal-text:#0f766e;
      --green-bg:#e9f8ef;--green-line:#8ed5a7;
      --red-bg:#fff0f0;--red-line:#f0aaaa;
      --amber-bg:#fff8e6;--amber-line:#efd28b;--amber-text:#9a6700;
      --blue-bg:#edf4ff;--blue-line:#a9c6f5;--blue-text:#1d4f91;
      --shadow:0 10px 28px rgba(16,42,86,0.05);
      --focus:0 0 0 4px rgba(16,42,86,0.12);
    }
    *{box-sizing:border-box;}html,body{margin:0;padding:0;}
    body{min-height:100vh;font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);}

    .topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,0.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft);}
    .topbar-inner{max-width:740px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:10px;}
    .brand-logo{width:34px;height:34px;border-radius:8px;background:#fff;border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .brand-logo img{width:72%;height:72%;object-fit:contain;}
    .brand-title{font-size:0.92rem;font-weight:800;color:var(--ink);}

    .shell{max-width:740px;margin:0 auto;padding:20px 20px 40px;}

    .phase-pill{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;font-size:0.7rem;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px;}
    .pill-practice{background:var(--amber-bg);color:var(--amber-text);border:1px solid var(--amber-line);}
    .pill-check{background:var(--blue-bg);color:var(--blue-text);border:1px solid var(--blue-line);}

    .instructions{font-size:0.82rem;color:var(--muted);line-height:1.6;margin-bottom:16px;padding:12px 14px;background:var(--blue-bg);border:1px solid var(--blue-line);border-radius:12px;}
    .instructions strong{color:var(--blue-text);}

    /* Profile */
    .card{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px;}
    .section-label{font-size:0.66rem;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:10px;}
    .profile-lines{font-size:0.84rem;line-height:1.8;color:var(--text);}
    .profile-lines .pk{color:var(--muted);font-weight:700;margin-right:4px;}
    .profile-lines .pv{font-weight:600;}
    .profile-lines .sep{color:#ccc;margin:0 8px;}

    /* Field note */
    .fn-card{background:#faf8f4;border:1px solid #ddd5c5;border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px;}
    .fn-label{font-size:0.7rem;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:#8b7355;margin-bottom:10px;}
    .fn-text{font-size:0.9rem;color:#4a3f30;line-height:1.9;}

    /* Algorithm */
    .algo-line{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:10px;margin-bottom:16px;border:1px solid var(--line-soft);}
    .algo-line.al-approve{background:#f8faf9;border-color:#d4e5d9;}
    .algo-line.al-reject{background:#fdf8f8;border-color:#e8d5d5;}
    .algo-lbl{font-size:0.72rem;color:var(--muted);font-weight:700;}
    .algo-val{font-size:0.84rem;font-weight:700;}
    .algo-val.av-approve{color:#2d6e46;}
    .algo-val.av-reject{color:#8b3a3a;}

    /* Decision */
    .dec-card{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;}
    .btn-group{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
    .dec-btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:11px 10px;font-size:0.82rem;font-weight:800;cursor:pointer;text-align:center;transition:border-color 0.15s,background 0.15s;}
    .dec-btn:hover{background:#f9fbfe;border-color:#bfd0e7;}
    .dec-btn.sel-approve{background:var(--green-text);color:#fff;border-color:var(--green-text);}
    .dec-btn.sel-reject{background:var(--red-text);color:#fff;border-color:var(--red-text);}
    .dec-btn.sel-escalate{background:var(--teal-text);color:#fff;border-color:var(--teal-text);}
    .reason-area{width:100%;min-height:56px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);padding:10px 12px;font-size:0.84rem;line-height:1.5;font-family:inherit;}
    .reason-area:focus{outline:none;border-color:var(--ink-2);box-shadow:var(--focus);}
    .sub-btn{display:block;margin:12px auto 0;width:200px;height:40px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-size:0.82rem;font-weight:800;cursor:pointer;transition:background 0.15s;}
    .sub-btn:hover{background:var(--ink-2);}
    .sub-btn:disabled{background:#b0b8c7;cursor:not-allowed;}

    /* Feedback */
    .fb{display:none;border-radius:12px;padding:14px;font-size:0.84rem;line-height:1.5;font-weight:700;margin-top:14px;border:1px solid transparent;}
    .fb-ok{background:var(--green-bg);color:var(--green-text);border-color:var(--green-line);}
    .fb-err{background:var(--red-bg);color:var(--red-text);border-color:var(--red-line);}
    .fb-warn{background:var(--amber-bg);color:var(--amber-text);border-color:var(--amber-line);}

    .proceed{display:none;margin:16px auto 0;width:240px;height:42px;border:0;border-radius:10px;background:#166534;color:#fff;font-size:0.84rem;font-weight:800;cursor:pointer;}
    .proceed:hover{background:#15803d;}
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand-logo"><img src="/static/assets/saral.png" alt="" onerror="this.style.display='none'"></div>
    <div class="brand-title">SARAL v2 — Practice</div>
  </div>
</div>

<div class="shell">
  <div id="phase-pill"></div>
  <div id="instructions" class="instructions"></div>

  <!-- Profile -->
  <div class="card">
    <div class="section-label">Applicant Profile</div>
    <div class="profile-lines" id="p-profile"></div>
  </div>

  <!-- Field Note -->
  <div class="fn-card">
    <div class="fn-label">Field Note</div>
    <div class="fn-text" id="p-fn"></div>
  </div>

  <!-- Algorithm -->
  <div class="algo-line" id="p-algo">
    <span class="algo-lbl">Algorithm Recommendation</span>
    <span class="algo-val" id="p-algo-val"></span>
  </div>

  <!-- Decision -->
  <div class="dec-card">
    <div class="section-label">Your Decision</div>
    <div class="btn-group">
      <div class="dec-btn" id="btn-approve" onclick="pick('approve')">APPROVE</div>
      <div class="dec-btn" id="btn-reject" onclick="pick('reject')">REJECT</div>
      <div class="dec-btn" id="btn-escalate" onclick="pick('escalate')" style="grid-column:span 2;">ESCALATE</div>
    </div>
    <textarea class="reason-area" id="d-reason" maxlength="300"
      placeholder="What specifically influenced your decision in this case?"></textarea>
    <button class="sub-btn" id="btn-sub" onclick="submit()" disabled>Submit</button>
    <div class="fb" id="fb"></div>
    <button class="proceed" id="btn-go" onclick="proceed()"></button>
  </div>
</div>

<script>
const SID = {{ session_id | tojson }};



let phase = 'practice';
let dec = null;
let checkAttempts = 0;
const MAX_ATTEMPTS = 2;

// ── Practice case: structurally different, not from the real pool ──
const PRACTICE = {
  profile: {
    age: 42,
    slum: 'Dharavi Transit Camp (practice)',
    claimed_since: 1996,
    voter_roll: '1999',
    housing: 'Kuccha (bamboo + plastic sheet)',
    society: 'Dharavi CHS (registered 2001)',
    documents: ['Voter roll (1999)', 'Electricity bill (2001)', 'Aadhaar', 'Self-declaration (A+B)'],
  },
  field_note: 'Applicant on voter roll since 1999. Electricity from 2001. Society member. All documents verified. Pre-cutoff existence confirmed. Current occupancy verified.',
  algo: 'APPROVE',
  algo_class: 'al-approve',
  algo_val_class: 'av-approve',
};

// ── Comprehension check: clearly rejectable case ──
const CHECK = {
  profile: {
    age: 31,
    slum: 'Navi Mumbai Transit (practice)',
    claimed_since: 2018,
    voter_roll: 'NOT on any roll before 2019',
    housing: 'Pakka (brick + concrete, recently constructed)',
    society: 'None',
    documents: ['Aadhaar', 'Self-declaration (A+B)'],
  },
  field_note: 'Applicant arrived in 2018. No pre-cutoff proof of structure existence. No voter roll entry before 2019. No electricity bill before 2020. Self-declarations filed. During site visit, structure appeared newly built with finished flooring and painted walls.',
  algo: 'REJECT',
  algo_class: 'al-reject',
  algo_val_class: 'av-reject',
  correct: 'reject',
};

const ROW_KEYS = [['age','slum'],['claimed_since','voter_roll'],['housing','society']];
const FULL_KEYS = ['documents'];
const L = {
  age:           'Age',
  slum:          'Location',
  claimed_since: 'Residence since',
  voter_roll:    'Voter roll',
  housing:       'Structure',
  society:       'Society',
  documents:     'Documents',
};

function renderProfile(prof) {
  let html = '';
  ROW_KEYS.forEach(row => {
    const parts = [];
    row.forEach(k => {
      if (!(k in prof)) return;
      let v = prof[k];
      if (Array.isArray(v)) v = v.join(', ');
      parts.push(`<span class="pk">${L[k]||k}:</span> <span class="pv">${v??'—'}</span>`);
    });
    if (parts.length) html += parts.join('<span class="sep">|</span>') + '<br>';
  });
  FULL_KEYS.forEach(k => {
    if (!(k in prof)) return;
    let v = prof[k];
    if (Array.isArray(v)) v = v.join(', ');
    html += `<span class="pk">${L[k]||k}:</span> <span class="pv">${v??'—'}</span>`;
  });
  return html;
}

function renderCase(c) {
  document.getElementById('p-profile').innerHTML = renderProfile(c.profile);
  document.getElementById('p-fn').textContent = c.field_note;
  document.getElementById('p-algo').className = `algo-line ${c.algo_class}`;
  const av = document.getElementById('p-algo-val');
  av.textContent = c.algo;
  av.className = `algo-val ${c.algo_val_class}`;

  // Reset
  dec = null;
  ['btn-approve','btn-reject','btn-escalate'].forEach(id => document.getElementById(id).className = 'dec-btn');
  document.getElementById('d-reason').value = '';
  document.getElementById('btn-sub').disabled = true;
  document.getElementById('fb').style.display = 'none';
  document.getElementById('btn-go').style.display = 'none';
}

function updatePhaseUI() {
  const pill = document.getElementById('phase-pill');
  const instr = document.getElementById('instructions');

  if (phase === 'practice') {
    pill.innerHTML = `<span class="phase-pill pill-practice">${'Practice Case'}</span>`;
    instr.innerHTML = '<strong>Practice case.</strong> Not recorded. Familiarise yourself with the layout — review the profile, read the field note, then make a decision.';
    renderCase(PRACTICE);
  } else {
    pill.innerHTML = `<span class="phase-pill pill-check">${'Comprehension Check'}</span>`;
    instr.innerHTML = '<strong>Comprehension check.</strong> Review this case carefully. The structured record and field note should guide your decision. You have 2 attempts.';
    renderCase(CHECK);
  }
}

function pick(d) {
  dec = d;
  ['btn-approve','btn-reject','btn-escalate'].forEach(id => document.getElementById(id).className = 'dec-btn');
  document.getElementById(`btn-${d}`).className = `dec-btn sel-${d}`;
  document.getElementById('btn-sub').disabled = false;
}

function submit() {
  const fb = document.getElementById('fb');
  const go = document.getElementById('btn-go');

  if (phase === 'practice') {
    fb.className = 'fb fb-ok';
    fb.textContent = 'Practice complete. Continue to the comprehension check.';
    fb.style.display = 'block';
    go.style.display = 'block';
    go.textContent = 'Continue →';
    document.getElementById('btn-sub').disabled = true;
  } else {
    checkAttempts++;
    if (dec === CHECK.correct) {
      fb.className = 'fb fb-ok';
      fb.textContent = 'Correct. The structured record shows no pre-cutoff proof and the field note confirms recent construction. You may now proceed.';
      fb.style.display = 'block';
      go.style.display = 'block';
      go.textContent = 'Begin Cases →';
      document.getElementById('btn-sub').disabled = true;

      fetch(`/session/${SID}/comprehension`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({passed: true, attempts: checkAttempts}),
      }).catch(() => {});

    } else if (checkAttempts >= MAX_ATTEMPTS) {
      fb.className = 'fb fb-warn';
      fb.textContent = 'The expected answer was REJECT based on the record. You may still proceed — your responses will be flagged for review.';
      fb.style.display = 'block';
      go.style.display = 'block';
      go.textContent = 'Proceed →';
      document.getElementById('btn-sub').disabled = true;

      fetch(`/session/${SID}/comprehension`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({passed: false, attempts: checkAttempts}),
      }).catch(() => {});

    } else {
      fb.className = 'fb fb-err';
      fb.textContent = `Incorrect. Look at the record carefully — does this applicant meet the criteria? ${MAX_ATTEMPTS - checkAttempts} attempt remaining.`;
      fb.style.display = 'block';
      dec = null;
      ['btn-approve','btn-reject','btn-escalate'].forEach(id => document.getElementById(id).className = 'dec-btn');
      document.getElementById('d-reason').value = '';
      document.getElementById('btn-sub').disabled = true;
    }
  }
}

function proceed() {
  if (phase === 'practice') {
    phase = 'check';
    updatePhaseUI();
    window.scrollTo(0, 0);
  } else {
    window.location.href = `/session/${SID}`;
  }
}

updatePhaseUI();
</script>
</body>
</html>
